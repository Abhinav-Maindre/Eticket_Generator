10431=The field 'bookingRef' is mandatory when generating an eticket of 'formatId' 'D10' or 'D11'.
10422=In element number 0 of the 'ticketDetails' array - The 'formatId' field of the 'headerDetails' object is invalid. FormatId must be one of the following: 'D01', 'D02', 'D04', 'D10', 'D11', or 'D12'.
10416=In element number 0 of the 'ticketDetails' array - The 'legs' array of the 'itinerary' cannot be empty.
10404=The 'tocReference' field is mandatory and is missing.
0003=The request contains at least one invalid MoP. A MoP must be one of the following: 'CARD', 'CASH', 'APPLEPAY', 'GOOGLEPAY', 'PAYPAL', or 'ALTMOP'.
10405=The 'recipientEmailAddress' field is mandatory and is missing.
10406=The 'totalPrice' field is invalid. This field is mandatory and cannot be negative.
10407=The 'ticketDetails' array cannot be empty.
